name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: GitHub Pages kurulumu
        uses: actions/configure-pages@v5

      - name: GitHub Pages yüklemesi
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Yayına al
        id: deployment
        uses: actions/deploy-pages@v4
