
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bursa Hızlı Teslimat | Yönetim Paneli</title>

<style>

:root{
    --bg:#06101d;
    --panel:#0d1b2c;
    --panel2:#12243a;
    --primary:#19c37d;
    --primary2:#35a7ff;
    --text:#f4f8fc;
    --muted:#94a6ba;
    --border:rgba(255,255,255,.09);
    --danger:#ff6262;
    --warning:#ffbd4a;
    --shadow:0 25px 70px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(25,195,125,.10),transparent 30%),
        radial-gradient(circle at 85% 15%,rgba(53,167,255,.10),transparent 30%),
        var(--bg);
    color:var(--text);
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================================================
   LOGIN
   ========================================================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.login-wrap{
    width:100%;
    max-width:460px;
}

.login-brand{
    text-align:center;
    margin-bottom:24px;
}

.brand-icon{
    width:76px;
    height:76px;
    margin:0 auto 16px;
    display:grid;
    place-items:center;
    border-radius:24px;
    font-size:40px;
    background:
        linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:
        0 20px 50px rgba(25,195,125,.20);
}

.login-brand h1{
    font-size:28px;
    margin-bottom:5px;
}

.login-brand p{
    color:var(--muted);
    font-size:14px;
}

.login-card{
    padding:34px;
    background:
        linear-gradient(145deg,rgba(18,36,58,.98),rgba(9,23,39,.98));
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:var(--shadow);
}

.login-card h2{
    font-size:22px;
    margin-bottom:7px;
}

.login-card-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
}

.input-wrap{
    position:relative;
}

.input-wrap input{
    width:100%;
    height:52px;
    padding:0 48px 0 15px;
    color:var(--text);
    background:#071522;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    transition:.2s ease;
}

.input-wrap input:focus{
    border-color:rgba(25,195,125,.7);
    box-shadow:0 0 0 4px rgba(25,195,125,.08);
}

.input-wrap input::placeholder{
    color:#617388;
}

.password-toggle{
    position:absolute;
    right:8px;
    top:7px;
    width:38px;
    height:38px;
    border:0;
    border-radius:9px;
    color:#b8c6d6;
    background:transparent;
}

.password-toggle:hover{
    background:rgba(255,255,255,.06);
}

.login-button{
    width:100%;
    height:52px;
    margin-top:5px;
    border:0;
    border-radius:12px;
    color:#03120c;
    font-weight:800;
    background:
        linear-gradient(135deg,#27df91,var(--primary));
    box-shadow:0 12px 30px rgba(25,195,125,.18);
    transition:.2s ease;
}

.login-button:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 35px rgba(25,195,125,.28);
}

.login-button:disabled{
    opacity:.65;
    transform:none;
}

.login-message{
    margin-top:15px;
    padding:13px;
    border-radius:11px;
    display:none;
    font-size:13px;
}

.login-message.show{
    display:block;
}

.login-message.error{
    color:#ff9b9b;
    background:rgba(255,98,98,.10);
    border:1px solid rgba(255,98,98,.25);
}

.login-message.success{
    color:#83f0be;
    background:rgba(25,195,125,.10);
    border:1px solid rgba(25,195,125,.25);
}

.forgot-button{
    width:100%;
    margin-top:17px;
    border:0;
    background:none;
    color:#7bc8ff;
    font-size:13px;
}

.forgot-button:hover{
    color:white;
}

.security-note{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--border);
    text-align:center;
    color:#71859b;
    font-size:11px;
}

/* =========================================================
   PANEL
   ========================================================= */

.admin-header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(6,16,29,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
}

.admin-header-inner{
    width:min(1400px,calc(100% - 32px));
    min-height:76px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.admin-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.admin-title-icon{
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    font-size:23px;
}

.admin-title strong{
    display:block;
    font-size:16px;
}

.admin-title small{
    color:var(--muted);
    font-size:11px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-button{
    min-height:40px;
    padding:0 13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--text);
    font-size:12px;
    font-weight:700;
}

.header-button:hover{
    background:rgba(255,255,255,.08);
}

.logout-button{
    border-color:rgba(255,98,98,.25);
    color:#ff9b9b;
}

/* =========================================================
   CONTENT
   ========================================================= */

.admin-main{
    width:min(1400px,calc(100% - 32px));
    margin:30px auto 70px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    margin-bottom:22px;
}

.stat-card{
    padding:20px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
}

.stat-card span{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
}

.stat-card strong{
    display:block;
    margin-top:8px;
    font-size:30px;
}

.stat-card:nth-child(1) strong{
    color:var(--warning);
}

.stat-card:nth-child(2) strong{
    color:#62c4ff;
}

.stat-card:nth-child(3) strong{
    color:#b98cff;
}

.stat-card:nth-child(4) strong{
    color:#ffc857;
}

.stat-card:nth-child(5) strong{
    color:var(--primary);
}

.dashboard-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.filter-button{
    border:1px solid var(--border);
    background:rgba(255,255,255,.035);
    color:#b8c6d6;
    border-radius:9px;
    padding:9px 12px;
    font-size:12px;
    font-weight:700;
}

.filter-button.active{
    background:rgba(25,195,125,.13);
    color:#83f0be;
    border-color:rgba(25,195,125,.35);
}

.refresh-button{
    border:1px solid var(--border);
    background:var(--panel);
    color:white;
    padding:10px 14px;
    border-radius:10px;
    font-weight:700;
}

/* =========================================================
   ALERT
   ========================================================= */

.new-order-alert{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:17px 19px;
    margin-bottom:17px;
    border-radius:15px;
    background:
        linear-gradient(135deg,rgba(25,195,125,.16),rgba(53,167,255,.10));
    border:1px solid rgba(25,195,125,.35);
    animation:alertPulse 1.3s ease infinite alternate;
}

.new-order-alert.show{
    display:flex;
}

@keyframes alertPulse{
    from{
        box-shadow:0 0 0 rgba(25,195,125,0);
    }
    to{
        box-shadow:0 0 30px rgba(25,195,125,.15);
    }
}

.new-order-alert strong{
    display:block;
    margin-bottom:3px;
}

.new-order-alert span{
    color:var(--muted);
    font-size:12px;
}

/* =========================================================
   ORDERS
   ========================================================= */

.orders-container{
    display:grid;
    gap:15px;
}

.order-card{
    padding:22px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:17px;
}

.order-title strong{
    display:block;
    font-size:17px;
}

.order-title small{
    color:#7e92a8;
    font-size:11px;
}

.order-status{
    padding:7px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    color:#c8d5e3;
    font-size:11px;
    font-weight:800;
}

.order-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.order-info{
    padding:12px;
    border-radius:11px;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.055);
}

.order-info.full{
    grid-column:1/-1;
}

.order-info label{
    display:block;
    margin-bottom:4px;
    color:#71859b;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}

.order-info div{
    color:#dce6f0;
    font-size:13px;
    word-break:break-word;
}

.price-row{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.price-row input{
    flex:1;
    min-width:0;
    height:43px;
    padding:0 12px;
    color:white;
    background:#071522;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
}

.price-row button{
    border:0;
    padding:0 15px;
    border-radius:9px;
    color:#04110b;
    background:var(--primary);
    font-weight:800;
}

.order-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
}

.status-button{
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:#dce6f0;
    padding:9px 12px;
    border-radius:9px;
    font-size:11px;
    font-weight:800;
}

.status-button:hover{
    background:rgba(255,255,255,.09);
}

.status-button.green{
    color:#83f0be;
    border-color:rgba(25,195,125,.25);
}

.status-button.red{
    color:#ff9b9b;
    border-color:rgba(255,98,98,.25);
}

.empty-state{
    padding:60px 20px;
    text-align:center;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
}

.empty-state strong{
    display:block;
    margin-bottom:6px;
}

.empty-state span{
    color:var(--muted);
    font-size:13px;
}

.dashboard-message{
    margin-bottom:15px;
    color:var(--muted);
    font-size:13px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:950px){

    .stats-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){

    .admin-header-inner{
        min-height:68px;
    }

    .admin-title strong{
        font-size:13px;
    }

    .admin-title small{
        display:none;
    }

    .header-actions{
        gap:5px;
    }

    .header-button{
        padding:0 9px;
        font-size:10px;
    }

    .admin-main{
        width:min(100% - 20px,1400px);
        margin-top:18px;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard-toolbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .filters{
        width:100%;
    }

    .filter-button{
        flex:1;
        min-width:100px;
    }

    .order-grid{
        grid-template-columns:1fr;
    }

    .order-info.full{
        grid-column:auto;
    }

    .order-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .status-button{
        width:100%;
    }
}

@media(max-width:480px){

    .login-card{
        padding:25px 20px;
    }

    .login-brand h1{
        font-size:23px;
    }

    .stats-grid{
        gap:8px;
    }

    .stat-card{
        padding:14px;
    }

    .stat-card strong{
        font-size:25px;
    }

    .new-order-alert{
        align-items:flex-start;
        flex-direction:column;
    }

    .price-row{
        flex-direction:column;
    }

    .price-row button{
        min-height:43px;
    }
}

</style>
</head>

<body>

<script type="module">

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://cwfkrwfvxurmtjkvllul.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Kg3VNlkTYcjRDctC5RHPxA_eaX7YkCA";

const module =
    await import(
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    );

const supabase =
    module.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* =========================================================
   ELEMENTLER
   ========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const adminApp =
    document.getElementById("adminApp");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loginMessage =
    document.getElementById("loginMessage");

const forgotBtn =
    document.getElementById("forgotBtn");

const passwordToggle =
    document.getElementById("passwordToggle");

const logoutBtn =
    document.getElementById("logoutBtn");

const soundBtn =
    document.getElementById("soundBtn");

const notificationBtn =
    document.getElementById("notificationBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const ordersContainer =
    document.getElementById("ordersContainer");

const dashboardMessage =
    document.getElementById("dashboardMessage");

const newOrderAlert =
    document.getElementById("newOrderAlert");

const alertCloseBtn =
    document.getElementById("alertCloseBtn");


/* =========================================================
   DURUM
   ========================================================= */

let currentFilter = "all";

let allOrders = [];

let previousOrderIds = [];

let firstOrderLoad = true;

let pollTimer = null;

let soundEnabled = true;

let audioContext = null;


/* =========================================================
   LOGIN MESAJI
   ========================================================= */

function showLoginMessage(
    text,
    type = "error"
){

    loginMessage.textContent = text;

    loginMessage.className =
        "login-message show " + type;
}


/* =========================================================
   ADMIN KONTROLÜ
   ========================================================= */

async function isAdmin(userId){

    const { data, error } =
        await supabase
            .from("admin_kullanicilar")
            .select("user_id")
            .eq("user_id", userId)
            .maybeSingle();

    if(error){
        console.error(error);
        return false;
    }

    return !!data;
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email || !password){

        showLoginMessage(
            "Lütfen e-posta ve şifrenizi girin."
        );

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent =
        "⏳ Giriş yapılıyor...";

    try{

        const { data, error } =
            await supabase.auth.signInWithPassword({
                email,
                password
            });

        if(error){
            throw error;
        }

        if(!data.user){
            throw new Error(
                "Kullanıcı bilgisi alınamadı."
            );
        }

        const admin =
            await isAdmin(data.user.id);

        if(!admin){

            await supabase.auth.signOut();

            throw new Error(
                "Bu hesap yönetici yetkisine sahip değil."
            );

/* =========================================================
   SES SİSTEMİ
   ========================================================= */

function initAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }catch(error){

        console.error(
            "Ses sistemi:",
            error
        );

    }
}


/* =========================================================
   TEK TON
   ========================================================= */

function playTone(
    frequency,
    startTime,
    duration,
    volume = 0.32
){

    if(!audioContext){
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        frequency,
        startTime
    );

    gain.gain.setValueAtTime(
        0.001,
        startTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        startTime + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        startTime + duration
    );

    oscillator.connect(gain);
    gain.connect(
        audioContext.destination
    );

    oscillator.start(
        startTime
    );

    oscillator.stop(
        startTime + duration + 0.03
    );
}

function playNewOrderSound(){

    if(!soundEnabled){

    initAudio();

    if(!audioContext){
        return;
    }

    const now =
        audioContext.currentTime;

    playTone(
        660,
        now,
        0.22,
        0.38
    );

    playTone(
        880,
        now + 0.23,
        0.22,
        0.42
    );

    playTone(
        1046,
        now + 0.46,
        0.30,
        0.45
    );

    playTone(
        880,
        now + 0.82,
        0.28,
        0.40
    );
}

/* =========================================================
   SİPARİŞLERİ YÜKLE
   ========================================================= */

async function loadOrders(){

    dashboardMessage.textContent =
        "Siparişler yükleniyor...";

    const { data, error } =
        await supabase
            .from("teslimat_talepleri")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );

    if(error){

        console.error(error);

        dashboardMessage.textContent =
            "Siparişler yüklenemedi.";

        return;

    }

    allOrders =
        data || [];

    const currentIds =
        allOrders.map(
            order => order.id
        );

    if(
        !firstOrderLoad
    ){

        const newOrders =
            currentIds.filter(
                id =>
                    !previousOrderIds.includes(
                        id
                    )
            );

        if(
            newOrders.length > 0
        ){

            showNewOrderAlert();

        }

    }

    previousOrderIds =
        currentIds;

    firstOrderLoad =
        false;

    updateStats();

    renderOrders();

    dashboardMessage.textContent =
        `${allOrders.length} sipariş bulundu.`;
}

   İSTATİSTİK
   ========================================================= */

function updateStats(){

    const count =
        (status) =>
            allOrders.filter(
                order =>
                    order.durum === status
            ).length;

    document.getElementById(
        "bekleyenCount"
    ).textContent =
        count("bekliyor");

    document.getElementById(
        "onaylananCount"
    ).textContent =
        count("onaylandi");

    document.getElementById(
        "kuryeCount"
    ).textContent =
        count("kurye_atandi");

    document.getElementById(
        "yoldaCount"
    ).textContent =
        count("yolda");

    document.getElementById(
        "tamamlananCount"
    ).textContent =
        count("teslim_edildi");
}


/* =========================================================
   DURUM İSMİ
   ========================================================= */

function statusLabel(status){

    const labels = {
        bekliyor:
            "Bekliyor",

        onaylandi:
            "Onaylandı",

        kurye_atandi:
            "Kurye Atandı",

        yolda:
            "Yolda",

        teslim_edildi:
            "Teslim Edildi",

        iptal:
            "İptal"
    };

    return labels[status] ||
        status;
}


/* =========================================================
   TARİH
   ========================================================= */

function formatDate(value){

    if(!value){
        return "-";
    }

    try{

        return new Date(value)
            .toLocaleString(
                "tr-TR",
                {
                    dateStyle:"short",
                    timeStyle:"short"
                }
            );

    }catch(_){

        return value;

    }
}


/* =========================================================
   HTML GÜVENLİĞİ
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   SİPARİŞLERİ GÖSTER
   ========================================================= */

function renderOrders(){

    let orders =
        [...allOrders];

    if(
        currentFilter !== "all"
    ){

        orders =
            orders.filter(
                order =>
                    order.durum ===
                    currentFilter
            );

    }

    if(!orders.length){

        ordersContainer.innerHTML = `
            <div class="empty-state">
                <strong>📦 Sipariş bulunamadı</strong>
                <span>
                    Bu filtrede gösterilecek teslimat talebi yok.
                </span>
            </div>
        `;

        return;
    }

    ordersContainer.innerHTML =
        orders.map(
            order =>
                createOrderCard(order)
        ).join("");

    attachOrderEvents();
}

/* =========================================================
   SİPARİŞ BUTONLARI
   ========================================================= */

function attachOrderEvents(){

    document
        .querySelectorAll(
            ".status-action"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const id =
                            button.dataset.id;

                        const status =
                            button.dataset.status;

                        await updateOrderStatus(
                            id,
                            status
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".save-price"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const id =
                            button.dataset.id;

                        const input =
                            document.querySelector(
                                `.order-price[data-id="${id}"]`
                            );

                        const value =
                            input?.value;

                        await updateOrderPrice(
                            id,
                            value
                        );

                    }
                );

            }
        );
}


/* =========================================================
   DURUM GÜNCELLE
   ========================================================= */

async function updateOrderStatus(
    id,
    status
){

    const { error } =
        await supabase
            .from("teslimat_talepleri")
            .update({
                durum:status
            })
            .eq(
                "id",
                id
            );

    if(error){

        console.error(error);

        alert(
            "Sipariş durumu güncellenemedi."
        );

        return;
    }

    await loadOrders();
}


/* =========================================================
   FİYAT GÜNCELLE
   ========================================================= */

async function updateOrderPrice(
    id,
    value
){

    let price = null;

    if(
        value !== "" &&
        value !== null &&
        value !== undefined
    ){

        price =
            Number(value);

        if(
            Number.isNaN(price) ||
            price < 0
        ){

            alert(
                "Geçerli bir fiyat girin."
            );

            return;
        }

    }

    const { error } =
        await supabase
            .from("teslimat_talepleri")
            .update({
                fiyat:price
            })
            .eq(
                "id",
                id
            );

    if(error){

        console.error(error);

        alert(
            "Fiyat kaydedilemedi."
        );

        return;
    }

    await loadOrders();
}


/* =========================================================
   FİLTRELER
   ========================================================= */

document

    )

/* =========================================================
   POLLING
   5 SANİYEDE BİR
   ========================================================= */

function startPolling(){

    stopPolling();

    pollTimer =
        setInterval(
            async () => {

                const {
                    data
                } =
                    await supabase.auth
                        .getUser();

                if(
                    data?.user
                ){

                    await loadOrders();

                }

            },
            5000
        );
}


function stopPolling(){

    if(pollTimer){

        clearInterval(
            pollTimer
        );

        pollTimer = null;

    }
}


/* =========================================================
   ŞİFRE SIFIRLAMA
   ========================================================= */

forgotBtn.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value.trim();

        if(!email){

            showLoginMessage(
                "Önce e-posta adresinizi girin."
            );

            emailInput.focus();

            return;
        }

        try{

            const { error } =
                await supabase.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.href
                        }
                    );

            if(error){
                throw error;
            }

            showLoginMessage(
                "Şifre sıfırlama bağlantısı e-posta adresinize gönderildi.",
                "success"
            );

        }catch(error){

            console.error(error);

            showLoginMessage(
                error.message ||

        }

    }
);

/* =========================================================
   SESSION KONTROLÜ
   ========================================================= */

async function checkExistingSession(){

    const {
        data
    } =
        await supabase.auth
            .getSession();

    const session =
        data?.session;

    if(!session){
        return;
    }

    const admin =
        await isAdmin(
            session.user.id
        );

    if(!admin){

        await supabase.auth.signOut();

        return;
    }

    initAudio();

    showAdminPanel();

    await loadOrders();

    startPolling();
}
